name: Visual Task Factory CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps
      - name: Run full test suite
        run: pytest -v
      - name: Validate committed sample suite
        run: vtf validate --dataset samples/demo_suite
      - name: Run mutation fault-detection suite
        run: vtf mutate

  docker:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify Dockerfile submission container
        run: |
          docker build -t visual-task-factory .
          docker run --rm visual-task-factory
